name: frontend-ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend:
    if: ${{ hashFiles('frontend/**') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: |
          if [ -f package.json ] && jq -e '.scripts.lint' package.json >/dev/null 2>&1; then npm run lint; else echo "no lint script"; fi

      - name: Type-check
        working-directory: frontend
        run: |
          if [ -f tsconfig.json ]; then npx tsc -v && npx tsc --noEmit; else echo "no tsconfig"; fi

      - name: Build
        working-directory: frontend
        run: npm run build
