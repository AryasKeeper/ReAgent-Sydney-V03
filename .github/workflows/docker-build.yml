name: docker-build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend-image:
    if: ${{ hashFiles('frontend/Dockerfile') != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}/frontend"
          SHA_TAG="$REPO:${GITHUB_SHA}"
          echo "sha=$SHA_TAG" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/heads/master || "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "latest=$REPO:latest" >> $GITHUB_OUTPUT
          fi
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            echo "pr=$REPO:pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.sha }}

      - name: Build and push (latest)
        if: ${{ steps.meta.outputs.latest }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.latest }}

      - name: Build and push (PR)
        if: ${{ steps.meta.outputs.pr }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.pr }}
