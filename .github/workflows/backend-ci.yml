name: backend-ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    if: ${{ hashFiles('backend/**') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f requirements-enhanced.txt ]; then pip install -r requirements-enhanced.txt; else echo "no requirements file"; fi
          pip install pytest pytest-asyncio flake8 mypy

      - name: Lint (flake8)
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        working-directory: backend
        run: flake8 .

      - name: Type-check (mypy)
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        working-directory: backend
        run: mypy --ignore-missing-imports .

      - name: Tests (pytest)
        if: ${{ hashFiles('backend/**/*.py') != '' && hashFiles('backend/**/tests/**') != '' }}
        working-directory: backend
        run: pytest -q
